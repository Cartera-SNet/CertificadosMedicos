<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Esculapio Soft — Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4ff; }
        .card { background:white; border-radius:1.25rem; box-shadow:0 8px 40px rgba(26,58,82,0.13); padding:2.5rem 2rem; width:100%; max-width:420px; }
        .input-field { width:100%; border:1.5px solid #e2e8f0; border-radius:.65rem; padding:.75rem 1rem .75rem 2.75rem; font-size:.9rem; color:#1e293b; outline:none; transition:border-color .2s; background:#f8fafc; }
        .input-field:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.1); }
        .input-icon { position:absolute; left:.875rem; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:.85rem; }
        .btn-login { background:linear-gradient(135deg,#1a3a52 0%,#2563eb 100%); color:white; border:none; border-radius:.75rem; padding:.875rem 1.5rem; font-size:.95rem; font-weight:600; width:100%; cursor:pointer; transition:opacity .2s; }
        .btn-login:hover { opacity:.92; }
        .btn-login:disabled { opacity:.6; cursor:not-allowed; }
        .error-box { background:#fef2f2; border:1px solid #fecaca; border-radius:.65rem; padding:.75rem 1rem; color:#dc2626; font-size:.85rem; display:flex; align-items:center; gap:.5rem; }
        .spinner { display:inline-block; width:1rem; height:1rem; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

<div class="card">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-6">
        <img src="/static/SIS.png" alt="SIS" class="h-10 mb-3">
        <div class="text-4xl mb-2">🤖</div>
        <h1 class="text-xl font-bold text-gray-800">Certificaciones Médicas SOAT</h1>
        <p class="text-gray-500 text-sm mt-1">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Error box -->
    <div id="errorBox" class="error-box mb-4 hidden">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorMsg">Error</span>
    </div>

    <!-- Status box -->
    <div id="statusBox" class="hidden mb-4 bg-blue-50 border border-blue-200 rounded-xl p-3 text-blue-700 text-sm flex items-center gap-2">
        <div class="spinner" style="border-color:rgba(37,99,235,.3);border-top-color:#2563eb"></div>
        <span id="statusMsg">Verificando...</span>
    </div>

    <form id="loginForm" class="space-y-4">
        <!-- Servidor -->
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">
                <i class="fas fa-server mr-1 text-gray-400"></i>Servidor
            </label>
            <div class="relative">
                <i class="fas fa-server input-icon"></i>
                <select id="servidor" class="input-field" required>
                    <option value="">— Cargando servidores... —</option>
                </select>
            </div>
        </div>

        <!-- Usuario -->
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">
                <i class="fas fa-user mr-1 text-gray-400"></i>Usuario
            </label>
            <div class="relative">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="usuario" class="input-field" placeholder="Tu usuario" autocomplete="username" required>
            </div>
        </div>

        <!-- Contraseña -->
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1.5">
                <i class="fas fa-lock mr-1 text-gray-400"></i>Contraseña
            </label>
            <div class="relative">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="input-field" placeholder="Tu contraseña" autocomplete="current-password" required>
                <button type="button" id="togglePass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                    <i class="fas fa-eye text-sm"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="btnLogin" class="btn-login mt-2">
            <span id="btnText"><i class="fas fa-sign-in-alt mr-2"></i>Ingresar</span>
            <span id="btnSpinner" class="hidden"><div class="spinner mx-auto"></div></span>
        </button>
    </form>

    <div class="mt-6 text-center">
        <div class="flex items-center gap-2 text-gray-300 text-xs mb-3">
            <div class="flex-1 h-px bg-gray-100"></div>
            <span>Esculapio Soft</span>
            <div class="flex-1 h-px bg-gray-100"></div>
        </div>
        <p class="text-xs text-gray-400">¿No tienes acceso? Contacta al administrador del sistema.</p>
    </div>
</div>

<p class="mt-6 text-xs text-gray-400">© 2026 SIS — Sistema de Información en Salud</p>

<script>
    // ── Servidores (cargados desde Railway que llama a la API) ──
    let servidoresData  = {};

    async function cargarServidores(intento = 1) {
        const sel = document.getElementById('servidor');
        try {
            const resp = await fetch('/api/servidores');
            const data = await resp.json();
            const nombres = Object.keys(data).sort();
            if (nombres.length === 0 && intento < 4) {
                sel.innerHTML = `<option value="">Cargando... (${intento}/3)</option>`;
                setTimeout(() => cargarServidores(intento + 1), 2500);
                return;
            }
            servidoresData = data;
            sel.innerHTML = '<option value="">— Selecciona servidor —</option>';
            nombres.forEach(n => {
                const o = document.createElement('option');
                o.value = n; o.textContent = n;
                sel.appendChild(o);
            });
        } catch(e) {
            if (intento < 4) {
                sel.innerHTML = `<option value="">Reintentando... (${intento}/3)</option>`;
                setTimeout(() => cargarServidores(intento + 1), 2500);
            } else {
                sel.innerHTML = '<option value="">⚠ Error cargando servidores — recarga</option>';
            }
        }
    }
    cargarServidores();

    // ── Toggle password ──
    document.getElementById('togglePass').addEventListener('click', () => {
        const inp = document.getElementById('password');
        const ico = document.querySelector('#togglePass i');
        if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fas fa-eye-slash text-sm'; }
        else { inp.type = 'password'; ico.className = 'fas fa-eye text-sm'; }
    });

    // ── Submit ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn      = document.getElementById('btnLogin');
        const btnText  = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');
        const statusBox = document.getElementById('statusBox');
        const statusMsg = document.getElementById('statusMsg');

        const servidor = document.getElementById('servidor').value;
        const usuario  = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value;

        errorBox.classList.add('hidden');

        if (!servidor) { errorBox.classList.remove('hidden'); errorMsg.textContent = 'Selecciona un servidor'; return; }
        if (!usuario || !password) { errorBox.classList.remove('hidden'); errorMsg.textContent = 'Completa todos los campos'; return; }

        btn.disabled = true;
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');

        const srvData = servidoresData[servidor] || {};
        const ip      = srvData.ip     || '';
        const puerto  = srvData.puerto || '3306';

        try {
            statusBox.classList.remove('hidden');
            statusMsg.textContent = 'Verificando credenciales...';

            // Railway llama a la API de Esculapio (tiene acceso a la red)
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ servidor, usuario, password })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                sessionStorage.setItem('empresas', JSON.stringify(data.empresas || []));
                sessionStorage.setItem('usuario',  usuario);
                sessionStorage.setItem('servidor', servidor);
                window.location.href = '/';
            } else {
                throw new Error(data.error || 'Credenciales inválidas');
            }

        } catch(err) {
            statusBox.classList.add('hidden');
            errorBox.classList.remove('hidden');
            errorMsg.textContent = err.message || 'Error de conexión';
            document.getElementById('password').value = '';
            btn.disabled = false;
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
        }
    });

    document.getElementById('usuario').focus();
</script>
</body>
</html>
