<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Esculapio Soft — Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4ff; }

        .login-card {
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 8px 40px rgba(26,58,82,0.13);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }

        .btn-login {
            background: linear-gradient(135deg, #1a3a52 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.875rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.02em;
        }
        .btn-login:hover  { opacity: 0.92; }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .input-field {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.65rem;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.9rem;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }
        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
            background: white;
        }
        .input-field::placeholder { color: #94a3b8; }

        .input-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.85rem;
            pointer-events: none;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.65rem;
            padding: 0.65rem 1rem;
            color: #dc2626;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Robot flotante */
        @keyframes rfloat {
            0%,100% { transform: translateY(0px); }
            50%      { transform: translateY(-6px); }
        }
        #loginRobot { animation: rfloat 3.5s ease-in-out infinite; }

        /* Spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }

        .divider {
            display: flex; align-items: center; gap: 0.75rem;
            color: #cbd5e1; font-size: 0.75rem; margin: 1.25rem 0;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1px; background:#e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-4">

    <!-- Card de login -->
    <div class="login-card">

        <!-- Logo + Título -->
        <div class="flex flex-col items-center mb-6">
            <img src="/static/SIS.png" alt="SIS" class="h-12 w-auto mb-4"
                 onerror="this.style.display='none'">

            <!-- Robot SVG -->
            <svg id="loginRobot" width="80" height="90" viewBox="0 0 120 130"
                 xmlns="http://www.w3.org/2000/svg" class="mb-3">
                <!-- Antena -->
                <line x1="60" y1="8" x2="60" y2="22" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
                <circle cx="60" cy="6" r="5" fill="#6366f1"/>
                <!-- Cabeza -->
                <rect x="28" y="22" width="64" height="46" rx="14" fill="#1e293b"/>
                <!-- Pantalla -->
                <rect x="35" y="29" width="50" height="32" rx="8" fill="#0f172a"/>
                <!-- Ojos -->
                <circle cx="47" cy="45" r="7" fill="#3b82f6"/>
                <circle cx="73" cy="45" r="7" fill="#3b82f6"/>
                <circle cx="47" cy="45" r="3.5" fill="#e0f2fe"/>
                <circle cx="73" cy="45" r="3.5" fill="#e0f2fe"/>
                <!-- Boca -->
                <rect x="46" y="54" width="28" height="4" rx="2" fill="#10b981"/>
                <!-- Cuerpo -->
                <rect x="33" y="72" width="54" height="42" rx="12" fill="#1e293b"/>
                <!-- Panel -->
                <rect x="42" y="80" width="36" height="26" rx="6" fill="#0f172a"/>
                <circle cx="52" cy="90" r="4" fill="#f59e0b"/>
                <circle cx="68" cy="90" r="4" fill="#10b981"/>
                <rect x="46" y="98" width="28" height="3" rx="1.5" fill="#334155"/>
                <!-- Brazos -->
                <rect x="10" y="74" width="20" height="10" rx="5" fill="#1e293b"/>
                <rect x="90" y="74" width="20" height="10" rx="5" fill="#1e293b"/>
                <!-- Piernas -->
                <rect x="40" y="116" width="14" height="12" rx="6" fill="#1e293b"/>
                <rect x="66" y="116" width="14" height="12" rx="6" fill="#1e293b"/>
            </svg>

            <h1 class="text-lg font-bold text-gray-800">Certificaciones Médicas SOAT</h1>
            <p class="text-xs text-gray-400 mt-0.5">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Formulario -->
        <form id="loginForm" autocomplete="off">

            <!-- Error -->
            <div id="errorBox" class="error-box mb-4 hidden">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMsg">Usuario o contraseña incorrectos</span>
            </div>

            <!-- Usuario -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">
                    <i class="fas fa-user mr-1 text-gray-400"></i>Usuario
                </label>
                <div class="relative">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="usuario" name="usuario"
                           class="input-field" placeholder="Tu usuario"
                           autocomplete="username" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-600 mb-1.5">
                    <i class="fas fa-lock mr-1 text-gray-400"></i>Contraseña
                </label>
                <div class="relative">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password"
                           class="input-field" placeholder="Tu contraseña"
                           autocomplete="current-password" required>
                    <!-- Toggle visibilidad -->
                    <button type="button" id="togglePass"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                        <i class="fas fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Botón -->
            <button type="submit" id="btnLogin" class="btn-login">
                <span id="btnText">
                    <i class="fas fa-sign-in-alt mr-2"></i>Ingresar
                </span>
                <span id="btnSpinner" class="hidden">
                    <i class="fas fa-circle-notch spinner mr-2"></i>Verificando...
                </span>
            </button>

        </form>

        <!-- Footer -->
        <div class="divider mt-5">Esculapio Soft</div>
        <p class="text-center text-xs text-gray-400">
            ¿No tienes acceso? Contacta al administrador del sistema.
        </p>

    </div>

    <p class="text-xs text-gray-400 mt-6">
        © 2026 SIS — Sistema de Información en Salud
    </p>

<script>
    // Toggle contraseña visible/oculta
    document.getElementById('togglePass').addEventListener('click', () => {
        const inp = document.getElementById('password');
        const ico = document.querySelector('#togglePass i');
        if (inp.type === 'password') {
            inp.type = 'text';
            ico.className = 'fas fa-eye-slash text-sm';
        } else {
            inp.type = 'password';
            ico.className = 'fas fa-eye text-sm';
        }
    });

    // Submit login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const usuario  = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('errorBox');
        const errorMsg = document.getElementById('errorMsg');
        const btnText  = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btn = document.getElementById('btnLogin');

        // Mostrar spinner
        errorBox.classList.add('hidden');
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
        btn.disabled = true;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, password })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                // Login exitoso → redirigir al app principal
                window.location.href = '/';
            } else {
                errorMsg.textContent = data.error || 'Usuario o contraseña incorrectos';
                errorBox.classList.remove('hidden');
                // Shake input
                document.getElementById('password').value = '';
                document.getElementById('usuario').focus();
            }
        } catch (err) {
            errorMsg.textContent = 'Error de conexión. Intenta nuevamente.';
            errorBox.classList.remove('hidden');
        } finally {
            btnText.classList.remove('hidden');
            btnSpinner.classList.add('hidden');
            btn.disabled = false;
        }
    });

    // Enter en campos
    ['usuario', 'password'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
        });
    });

    // Focus automático
    document.getElementById('usuario').focus();
</script>
</body>
</html>
