[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
aptPkgs = [
  "libreoffice",
  "libreoffice-writer", 
  "fonts-liberation",
  "fonts-dejavu",
  "python3-pip"
]

[build.nixpacksPlan.phases.install]
cmds = [
  "pip install flask==3.0.3 requests==2.31.0 openpyxl==3.1.2 python-docx==1.1.2 Pillow urllib3"
]

[deploy]
startCommand = "python app.py"
restartPolicyType = "on_failure"